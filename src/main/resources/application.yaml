---
spring:
  application:
    name: houseepg

server:
  port: 8094

houseepg:
  # Channel authority. Its tvg-ids become the emitted XMLTV channel ids.
  # Leave empty to seed the registry from the top-priority source instead.
  playlist-url: ${HOUSEEPG_PLAYLIST_URL:}
  # Ended programmes older than this are pruned from the store.
  retention: 7d
  timeout: 60s
  # The file the source order is written back into (ADR-0005). Empty keeps the order in memory only.
  config-file: ${HOUSEEPG_CONFIG_FILE:src/main/resources/application.yaml}
  scheduler:
    tick: 60s
  # Priority order, highest first: the first enabled source is the
  # primary source. Point these at the real per-country XMLTV files;
  # the entries below stay disabled until then.
  sources:
    - id: provider-a
      name: Provider A
      url: ${HOUSEEPG_SOURCE_A_URL:}
      # Each source refreshes on its own interval (default 8h).
      refresh-interval: 8h
      enabled: false
    - id: provider-b
      name: Provider B
      url: ${HOUSEEPG_SOURCE_B_URL:}
      enabled: false
