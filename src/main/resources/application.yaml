---
spring:
  application:
    name: houseepg

server:
  port: 8094

houseepg:
  # Channel authority. Its tvg-ids become the emitted XMLTV channel ids.
  # Leave empty to seed the registry from the top-priority source instead.
  playlist-url: ${HOUSEEPG_PLAYLIST_URL:}
  # How long a built guide is served before it is rebuilt.
  cache-ttl: 1h
  timeout: 60s
  # Priority order, highest first: the first enabled source is the
  # primary source. Point these at the real per-country XMLTV files;
  # the entries below stay disabled until then.
  sources:
    - id: provider-a
      name: Provider A
      url: ${HOUSEEPG_SOURCE_A_URL:}
      enabled: false
    - id: provider-b
      name: Provider B
      url: ${HOUSEEPG_SOURCE_B_URL:}
      enabled: false
